# Miharashi 設定例。コメントアウトした行は既定値(例示・推奨と記したものを除く)。
# 置き場所の検索順: --config → ~/.config/miharashi/config.toml → /etc/miharashi/config.toml

[runtime]
# seat = "auto"            # auto / libseat / direct(libseat を使わず、video・input グループで直接開く)
# max_seconds = 0          # 0 = 無期限。試験用に自動終了させる秒数
# stats_interval_secs = 60 # 状態ログ(RSS・フレーム時間など)の間隔。systemd では journal に残る

[display]
# 表示先 GPU。/dev/dri/cardN は固定しない。
# card = "auto"            # auto / /dev/dri/card1 / pci:0000:0e:00.0 / driver:amdgpu
# connector = "auto"       # auto / HDMI-A-1 / DP-1 ...
# mode = "preferred"       # preferred / 1920x1080 / 1920x1080@60
# renderer = "cpu"         # cpu / gles / auto(GLES を試し、使えなければ cpu に戻る)。描画は表示カードの GPU だけで行う

[input]
# devices = []             # デバイス名に含む文字列。空なら 4/6 か矢印キーを持つ全キーボード

[geoframe]
# url = "http://127.0.0.1:8080"
# photo_interval_secs = 30
# reconnect_min_secs = 1   # 接続失敗時の再接続は指数バックオフ(min から倍々で max まで)
# reconnect_max_secs = 60
# 写真は「旅」と「いつもの暮らし」に分けて流す。自宅([home_assistant] の位置)から
# home_radius_km 以上離れた写真を撮影間隔 48 時間で旅に区切り、近い写真は季節ごとにまとめる。
# 1 周ごとにまとまりの順番を混ぜ、各まとまりから最大 6 枚を撮影順に出す。5 枚以上のまとまりの
# 前には地図つきのカードを card_secs 秒挟む。自宅が分からなければ GEOFRAME の旅番号でまとめる。
# home_radius_km = 50.0
# card_secs = 10

[metrics]
# interval_secs = 1
# 監視する GPU。表示先 GPU とは独立に指定できる。
# gpu = "auto"             # auto / 0(NVML インデックス)/ pci:0000:01:00.0

[power]
# 電力量(今日・累計)の保存先。書き込めない場合は起動中だけメモリ上で積算する。空なら保存しない。
# state_file = "/var/lib/miharashi/energy.json"
# CPU の RAPL 積算値。root のヘルパーが約 1 秒ごとに "<energy_uj> <max_energy_range_uj>" の 1 行を書く。
# 無ければ /sys/class/powercap/intel-rapl:0 を直接読む(通常は root 限定で読めず、CPU の W は -- になる)。
# rapl_helper_file = "/run/miharashi-rapl/energy"
# 電気代の単価 [円/kWh]。0 なら電気代を表示しない。
# price_per_kwh = 0

[home_assistant]
# 画面の電源制御(下の [screen_power])に使う。url が空なら連携しない(画面は常に点灯)。
# 平文 http は IP アドレスか localhost に限る(ホスト名だと mDNS/DNS の偽装でトークンが盗まれる)。
# url = ""                 # 例: http://192.0.2.10:8123 / https://ha.example.test
# 長期アクセストークンを 1 行で書いたファイル。実行ユーザーだけが読めるようにする
# (例: sudo install -m 0640 -o root -g <実行ユーザー> token.txt /etc/miharashi/ha-token)。
# token_file = "/etc/miharashi/ha-token"

[screen_power]
# 不在が続いたら画面を消す(DPMS)。表示機のキー操作も在宅として扱い、消えていれば点ける。
# presence_entity = ""     # person.xxx / binary_sensor.xxx。state が home か on なら在宅
# mode_entity = ""         # 手動オーバーライドの input_select(auto / force_on / force_off)。空なら auto 固定
# idle_minutes = 10        # 不在がこの分数を超えたら消す
# override_decay_minutes = 5  # HA と通信できない状態がこの分数を超えたら、オーバーライドを捨てて auto に戻す
# poll_secs = 10           # HA に問い合わせる間隔
# HA と通信できないとき、auto では画面を点けたままにする。

[alerts]
# 地震アラート。全画面の上に震源と各地の震度の地図を重ね、画面を消していても点けて見せる。
# 条件は「住んでいる地方(気象庁の地方区分。[home_assistant] の自宅の位置から決める)で震度 4 以上」
# または「全国で震度 5 弱以上」。住んでいる地方を決められないときは全国の条件だけで動く。
# quake = true
# quake_poll_secs = 30     # 気象庁の地震情報を読む間隔(10 以上)
# 災害アラート。自宅から半径 disaster_radius_km の市町村に、特別警報(レベル 5)か
# 土砂災害危険警報(レベル 4。以前の土砂災害警戒情報)が新しく出たら、地震と同じように重ねる。
# 大雨・高潮の危険警報(レベル 4)と、氾濫(指定河川洪水予報)は対象外。
# disaster = true
# disaster_poll_secs = 60  # 気象庁の警報を読む間隔(30 以上)。変わっていなければ 304 で済む
# disaster_radius_km = 50.0
# show_minutes = 5         # 表示を続ける分数。キーを押せば先に閉じる
# demo_after_secs = 0      # 0 より大きければ、起動からこの秒数後に地震、その 30 秒後に災害のテスト表示を出す

[aircraft]
# 航空機の画面(4/6 で切り替える画面の 1 つ)。左に受信機から radius_km 以内のレーダー、
# 右に注目する機体の諸元(adsbdb で機種・登録記号・運航会社・経路を引く)。8/2 で注目する機体を
# 近い順に切り替え、5 でいちばん近い機体に戻す。enabled = false なら画面ごと出さない。
# enabled = true
# url = "https://ads-b.dam-lab.work/tar1090/data/aircraft.json"  # 受信機の位置は同じ場所の receiver.json
# poll_secs = 5
# radius_km = 50.0

[room]
# 室内環境と天気の画面(4/6 で切り替える画面の 1 つ。写真の次)。左に室内センサー(HA)の値と過去の折れ線、
# 右に気象庁の府県予報(今日・明日)と週間予報、下の帯に自宅の市町村の警報・注意報([alerts] disaster の取得を使う)。
# HA や気象庁に届かないときは最後の値と取得時刻を黄色で出す。HA の url も forecast_area も無ければ画面ごと出さない。
# enabled = true
# 室内センサーのタイル(表示順、最大 6 枚)。単位は HA のもの(mbar は hPa と書く)。
#   warn / alert: この値以上で黄 / 赤。second: 値の右に並べる 2 つ目の entity。trend_hours: この時間前からの上昇・下降
# tiles = [
#   { label = "温度", entity = "sensor.living_temperature" },
#   { label = "CO2",  entity = "sensor.living_co2", warn = 1000, alert = 1500 },
#   { label = "気圧", entity = "sensor.living_pressure", trend_hours = 3 },
#   { label = "玄関", entity = "sensor.door_temperature", second = "sensor.door_humidity" },
# ]
# history_hours = 24       # 折れ線に出す過去の時間(1〜168)
# 天気予報の地域(気象庁 area.json の class10。東京地方なら "130010")。空なら HA の自宅の位置から決める
# forecast_area = ""
# poll_secs = 60           # センサーの値を読む間隔(10 以上)
# history_minutes = 10     # 折れ線の履歴を読み直す間隔
# forecast_minutes = 30    # 天気予報を読む間隔(5 以上。気象庁の発表は 1 日 3 回)

[agents]
# T3 Code の閲覧専用 Agent 一覧。既定は無効。認証用 bearer は専用ファイルから読み、設定には書かない。
# bearer は GET /api/orchestration/shell にだけ使う。環境表示用に認証なしの GET /.well-known/t3/environment も行う。
# 更新系 API は呼び出さない。
# enabled = false
# 例示用の接続先。既定値は http://192.168.0.132:3773。自分の T3 に合わせる
# url = "http://192.0.2.10:3773"
# T3 の bearer は 30 日で切れる。miharashi-t3-token.timer が週 1 回、読み取りだけのトークンを作り直して
# このファイルを置き換える(docs/DESIGN-t3-token.md)。そのため実行ユーザーが書ける場所に置く。
# 推奨: 自動更新で書き換えられる場所。既定値は /etc/miharashi/t3-agent.token
# token_file = "/var/lib/miharashi/t3-agent.token"
# poll_secs = 5
# timeout_secs = 3
# stale_secs = 30
# recent_hours = 24

[cube]
# 3D の画面(回る立方体。GLES 専用。renderer = cpu や GL なしでは案内を出し、自動巡回では飛ばす)。既定は無効。
# 画面 id は cube(全面)と cube-third(中央 1/3 幅の領域を単色の下地に重ねる)。[rotation] の steps や
# ui.start_screen に書ける(start_screen は有効にした画面だけ)。
# enabled = false
# layout = "both"   # full / third / both
# fps = 30          # 動いている間の描画の上限(0 = 制限せず vsync だけ)

[gl_check]
# GL の状態をわざと汚したまま返す試験画面 dirty-a・dirty-b(実機の確認用。docs/DESIGN-screen-plugin-v2.md §5.5)。既定は無効。
# 巡回の steps に書くと、直後の写真・Radar・Agent・キューブが崩れないことを目で確かめられる。
# enabled = false

[rotation]
# 無人のときの自動巡回。画面 id と表示する秒数の手順を上から順に繰り返す。有効なら ui.start_screen ではなく
# 最初の手順の画面から始める。出していない画面(無効な航空機など)の手順は飛ばす。
# skip_if_empty = true の手順は、出すものが無ければ飛ばす(航空機の画面で、半径内に機体がいないとき)。
# キー・操作パネルで操作したら pause_after_input_secs 秒止め、最後の操作から時間がたったら次の手順から戻る。
# アラートの間は手順の時間を進めない。写真画面に戻ると続きの写真から(写真は表示中だけ進む)。
# 操作パネルから止めたままにでき、再開もできる(POST /api/v1/rotation)。再開するとすぐ次の手順へ移る。
# 止めた状態は保存しないので、キオスクを再起動すると巡回は戻る。
# enabled = false
# steps = [
#   { screen = "photo",    secs = 600 },
#   { screen = "room",     secs = 60 },
#   { screen = "photo",    secs = 600 },
#   { screen = "aircraft", secs = 60, skip_if_empty = true },
#   { screen = "status",   secs = 30 },
# ]
# pause_after_input_secs = 300

[ui]
# font = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
# start_screen = "status"  # status / photo / room / aircraft / agents([rotation] が有効なら使わない)
# 焼き付き対策: refresh_minutes 分ごとに、refresh_screens の画面をグリッチ → 暗転 → 再表示(約 1.6 秒)で
# 描き直し、そのたびに画面全体を数 px ずらす(9 か所を順に回る)。0 なら行わない。動かない線が多い画面に使う(状況画面も入れるなら ["aircraft", "status"])
# refresh_minutes = 5
# refresh_screens = ["aircraft"]  # 現在 agents はrefresh演出未対応

[panel]
# 手元の操作パネル(Echo Show 5 など)向けの API(docs/panel/DESIGN.md)。既定は無効。
# 待ち受けは LAN のインターフェース(enp11s0)の IP だけにする。0.0.0.0 / :: は不可。Tailscale では待ち受けない。
# トークンは 16 文字以上を 1 行で書いたファイル。ha-token と同じく root:<実行ユーザー> 0640(か 0600)。誰でも読める権限なら起動しない。
# 例: head -c 24 /dev/urandom | base64 | sudo install -o root -g hermes -m 640 /dev/stdin /etc/miharashi/panel.token
# 待ち受けられない(起動直後でまだ IP が無いなど)ときは 30 秒ごとに再試行する。
# 使えるキーは prev / next / select / up / down / menu(4 / 6 / 5 / 8 / 2 / 0)。
# POST /api/v1/screen で画面を直接選び、POST /api/v1/rotation で巡回の停止・再開ができる。
# enabled = false
# listen = "192.168.0.132:8790"
# token_file = "/etc/miharashi/panel.token"
# max_rate_per_sec = 20    # POST /api/v1/input を 1 秒にこの回数まで。超えたら 429
