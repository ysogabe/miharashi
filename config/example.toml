# Miharashi 設定例。コメントアウトした行は既定値。
# 置き場所の検索順: --config → ~/.config/miharashi/config.toml → /etc/miharashi/config.toml

[runtime]
# seat = "auto"            # auto / libseat / direct(libseat を使わず、video・input グループで直接開く)
# max_seconds = 0          # 0 = 無期限。試験用に自動終了させる秒数
# stats_interval_secs = 60 # 状態ログ(RSS・フレーム時間など)の間隔。systemd では journal に残る

[display]
# 表示先 GPU。/dev/dri/cardN は固定しない。
# card = "auto"            # auto / /dev/dri/card1 / pci:0000:0e:00.0 / driver:amdgpu
# connector = "auto"       # auto / HDMI-A-1 / DP-1 ...
# mode = "preferred"       # preferred / 1920x1080 / 1920x1080@60
# renderer = "cpu"         # cpu / gles / auto(GLES を試し、使えなければ cpu に戻る)。描画は表示カードの GPU だけで行う

[input]
# devices = []             # デバイス名に含む文字列。空なら 4/6 か矢印キーを持つ全キーボード

[geoframe]
# url = "http://127.0.0.1:8080"
# photo_interval_secs = 30
# reconnect_min_secs = 1   # 接続失敗時の再接続は指数バックオフ(min から倍々で max まで)
# reconnect_max_secs = 60

[metrics]
# interval_secs = 1
# 監視する GPU。表示先 GPU とは独立に指定できる。
# gpu = "auto"             # auto / 0(NVML インデックス)/ pci:0000:01:00.0

[power]
# 電力量(今日・累計)の保存先。書き込めない場合は起動中だけメモリ上で積算する。空なら保存しない。
# state_file = "/var/lib/miharashi/energy.json"
# CPU の RAPL 積算値。root のヘルパーが約 1 秒ごとに "<energy_uj> <max_energy_range_uj>" の 1 行を書く。
# 無ければ /sys/class/powercap/intel-rapl:0 を直接読む(通常は root 限定で読めず、CPU の W は -- になる)。
# rapl_helper_file = "/run/miharashi-rapl/energy"
# 電気代の単価 [円/kWh]。0 なら電気代を表示しない。
# price_per_kwh = 0

[home_assistant]
# 画面の電源制御(下の [screen_power])に使う。url が空なら連携しない(画面は常に点灯)。
# 平文 http は IP アドレスか localhost に限る(ホスト名だと mDNS/DNS の偽装でトークンが盗まれる)。
# url = ""                 # 例: http://192.0.2.10:8123 / https://ha.example.test
# 長期アクセストークンを 1 行で書いたファイル。実行ユーザーだけが読めるようにする
# (例: sudo install -m 0640 -o root -g <実行ユーザー> token.txt /etc/miharashi/ha-token)。
# token_file = "/etc/miharashi/ha-token"

[screen_power]
# 不在が続いたら画面を消す(DPMS)。表示機のキー操作も在宅として扱い、消えていれば点ける。
# presence_entity = ""     # person.xxx / binary_sensor.xxx。state が home か on なら在宅
# mode_entity = ""         # 手動オーバーライドの input_select(auto / force_on / force_off)。空なら auto 固定
# idle_minutes = 10        # 不在がこの分数を超えたら消す
# override_decay_minutes = 5  # HA と通信できない状態がこの分数を超えたら、オーバーライドを捨てて auto に戻す
# poll_secs = 10           # HA に問い合わせる間隔
# HA と通信できないとき、auto では画面を点けたままにする。

[ui]
# font = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
# start_screen = "status"  # status / photo
