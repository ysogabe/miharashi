[package]
name = "miharashi-app"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# bench の合成写真(JPEG のエンコード・デコード)。miharashi-render と同じ版
image = "0.25.10"
miharashi-render = { version = "0.1.0", path = "../miharashi-render" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
signal-hook = "0.4.5"
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = "3.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
miharashi-gpu = { path = "../miharashi-gpu" }
miharashi-linux = { path = "../miharashi-linux" }

[[bin]]
name = "miharashi"
path = "src/main.rs"
