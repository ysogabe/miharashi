[package]
name = "miharashi-app"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# 3D の試験用場面(scene_check)が GL を直接呼ぶ。miharashi-glscene と同じ版
glow = "0.18.0"
# bench の合成写真(JPEG のエンコード・デコード)。miharashi-render と同じ版
image = "0.25.10"
miharashi-glscene = { path = "../miharashi-glscene" }
miharashi-render = { version = "0.1.0", path = "../miharashi-render" }
# 画面に載せる VRM(WithScene)。GPU・DRM に触れる bin 用の feature は要らない
miharashi-vrm = { path = "../miharashi-vrm", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# 上書きファイル(admin.toml)の世代(内容の SHA-256 の先頭 16 桁)
sha2 = "0.11"
signal-hook = "0.4.5"
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = "3.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
miharashi-gpu = { path = "../miharashi-gpu" }
miharashi-linux = { path = "../miharashi-linux" }
# B2 の動画ベンチマーク(`--features video`)。ffmpeg の開発用パッケージが要るので既定では入れない
miharashi-video = { path = "../miharashi-video", optional = true }

[features]
video = ["dep:miharashi-video"]

[[bin]]
name = "miharashi"
path = "src/main.rs"
