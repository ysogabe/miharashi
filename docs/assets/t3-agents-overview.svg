    text { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-weight: 400; fill: #dfe7f0; }
    .muted { fill: #8fa3b7; }
    .small { font-size: 24px; }
    .card { will-change: transform; }
  </style>
  <defs>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#080c14"/>
